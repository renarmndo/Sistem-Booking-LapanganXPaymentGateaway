services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-football_booking}
      MYSQL_USER: ${DB_USER:-app_user}
      MYSQL_PASSWORD: ${DB_PASS:-app_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-root_password}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
      TZ: Asia/Jakarta
    command: --default-time-zone=+07:00
    volumes:
      - mysql_dev_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - app_internal

  redis:
    image: redis:7.4-alpine
    command:
      [
        "sh",
        "-c",
        'redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes',
      ]
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASS:-redis_password}
    networks:
      - app_internal

  backend:
    image: golang:1.27-alpine
    working_dir: /app
    command: >-
      sh -c "go install github.com/air-verse/air@latest &&
      air -c .air.toml"
    environment:
      APP_ENV: development
      APP_PORT: 8080
      TZ: Asia/Jakarta
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-app_user}
      DB_PASS: ${DB_PASS:-app_password}
      DB_NAME: ${DB_NAME:-football_booking}
      REDIS_ADDR: redis:6379
      REDIS_PASS: ${REDIS_PASS:-redis_password}
      JWT_SECRET: ${JWT_SECRET:-change-me-with-at-least-32-random-bytes}
      ALLOWED_ORIGINS: http://localhost:5173
    volumes:
      - ./bl-backend:/app
      - go_build_cache:/root/.cache/go-build
      - go_mod_cache:/go/pkg/mod
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_internal

  frontend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:8080/api/v1
    volumes:
      - ./bl-frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
    networks:
      - app_internal

volumes:
  mysql_dev_data:
  redis_dev_data:
  go_build_cache:
  go_mod_cache:
  frontend_node_modules:

networks:
  app_internal:
    driver: bridge
